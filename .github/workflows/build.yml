name: Check and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            name: windows
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            name: macos-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - name: Add macOS targets
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run package -- ${{ matrix.args }} -- --locked
        if: github.event_name == 'workflow_dispatch'
      - name: Build Windows CLI
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        run: npm run package:cli
      - name: Build universal macOS CLI
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
        run: |
          npm run package:cli -- --target aarch64-apple-darwin
          npm run package:cli -- --target x86_64-apple-darwin
          lipo -create src-tauri/target/aarch64-apple-darwin/release/gpu-monitor-cli src-tauri/target/x86_64-apple-darwin/release/gpu-monitor-cli -output src-tauri/target/universal-apple-darwin/release/gpu-monitor-cli
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: gpu-monitor-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/gpu-monitor-cli.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/gpu-monitor-cli
          if-no-files-found: error
